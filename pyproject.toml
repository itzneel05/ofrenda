[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ofrenda"
version = "0.1.0"
description = "A Día de los Muertos ofrenda for the files your repository deleted — eulogies written by a local Gemma model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "itzneel05" }]
keywords = ["git", "dia-de-los-muertos", "ofrenda", "gemma", "ollama", "eulogy"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
ofrenda = "ofrenda.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/itzneel05/ofrenda"
Issues = "https://github.com/itzneel05/ofrenda/issues"

[tool.setuptools.packages.find]
include = ["ofrenda*"]
